name: sylvie
version: '3.9'

# Environment variables are loaded from .env file in the project root
# Copy .env.example to .env and fill in your values
# For production, use .env.production or set environment variables in your deployment platform

# ⚠️  SECURITY WARNING ⚠️
# The default database credentials below are INSECURE and should NEVER be used in production.
# For production deployments:
#   1. Set POSTGRES_PASSWORD to a strong, randomly generated password (REQUIRED - no default)
#   2. Change POSTGRES_USER and POSTGRES_DB from defaults
#   3. Use environment variables or secrets management (not hardcoded values)
#   4. Ensure your .env file is in .gitignore and never committed to version control
# For development: Defaults are acceptable but still recommended to use a .env file

services:
  postgres:
    image: postgres:16-alpine
    container_name: sylvie-postgres
    restart: unless-stopped
    environment:
      # ⚠️  WARNING: Default value 'sylvie' is for development only. Change for production!
      POSTGRES_USER: ${POSTGRES_USER:-sylvie}
      # ⚠️  CRITICAL: POSTGRES_PASSWORD has NO default - you MUST set this explicitly!
      #    For production, use a strong password (e.g., generate with: openssl rand -base64 32)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable is required. Set it in your .env file or environment.}
      # ⚠️  WARNING: Default value 'sylvie' is for development only. Change for production!
      POSTGRES_DB: ${POSTGRES_DB:-sylvie}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-sylvie} -d ${POSTGRES_DB:-sylvie}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sylvie-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: sylvie-server
    restart: unless-stopped
    ports:
      - '${PORT:-3001}:${PORT:-3001}'
    # Load environment variables from .env file if it exists (optional)
    # Create .env file in project root based on DOCKER.md
    env_file:
      - .env
    environment:
      # Database
      # ⚠️  WARNING: Default DATABASE_URL uses insecure defaults. Set explicitly for production!
      DATABASE_URL: ${DATABASE_URL:-postgresql://sylvie:password@postgres:5432/sylvie}
      # Server
      PORT: ${PORT:-3001}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # Better Auth
      # ⚠️  CRITICAL: BETTER_AUTH_SECRET is REQUIRED for secure authentication!
      #    Generate with: openssl rand -base64 32
      #    In production, this MUST be set to prevent authentication vulnerabilities
      BETTER_AUTH_SECRET: '${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET environment variable is required. Set it in your .env file or environment. Generate with: openssl rand -base64 32}'
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # OAuth Providers (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sylvie-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
        - NODE_ENV=${NODE_ENV:-production}
    container_name: sylvie-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    # Load environment variables from .env file if it exists (optional)
    # Create .env file in project root based on DOCKER.md
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3001}
      # Database (may be needed for server-side operations)
      # ⚠️  WARNING: Default DATABASE_URL uses insecure defaults. Set explicitly for production!
      DATABASE_URL: ${DATABASE_URL:-postgresql://sylvie:password@postgres:5432/sylvie}
    depends_on:
      - server
    networks:
      - sylvie-network

networks:
  sylvie-network:
    driver: bridge

volumes:
  postgres_data:
