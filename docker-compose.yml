name: sylvie
version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sylvie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sylvie
      POSTGRES_PASSWORD: sylvie
      POSTGRES_DB: sylvie
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sylvie -d sylvie']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
